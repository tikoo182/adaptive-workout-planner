services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-workout_planner}"
      POSTGRES_USER: "${POSTGRES_USER:-workout_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-workout_planner}"
      POSTGRES_USER: "${POSTGRES_USER:-workout_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workout_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: