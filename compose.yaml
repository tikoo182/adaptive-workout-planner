services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-workout_planner}"
      POSTGRES_USER: "${POSTGRES_USER:-workout_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workout_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: